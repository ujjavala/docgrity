services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docgrity
      POSTGRES_PASSWORD: docgrity
      POSTGRES_DB: docgrity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgrity"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn docgrity.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://docgrity:docgrity@postgres:5432/docgrity
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: arq docgrity.workflows.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://docgrity:docgrity@postgres:5432/docgrity
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
