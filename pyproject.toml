[project]
name = "docgrity"
version = "0.1.0"
description = "Agentic knowledge-integrity platform"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
keywords = ["mcp", "knowledge", "documentation", "confluence", "agents"]
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "arq>=0.26",
    "httpx>=0.27",
    "mcp>=1.2",
    "openai>=1.50",
    "anthropic>=0.40",
    "pydantic-ai>=0.1",
    "pyjwt[crypto]>=2.9",
    # 47+ wheels crash (SIGILL) inside the linux/arm64 container; 46.x is the
    # newest importable line and patches PYSEC-2026-35/36/2141.
    "cryptography>=46.0.7,<47",
]

[project.scripts]
docgrity-mcp = "docgrity.mcp.docgrity.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docgrity"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires running Postgres (docker compose up postgres)"]

[tool.coverage.run]
source = ["src/docgrity"]
omit = ["src/docgrity/mcp/docgrity/server.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
